[project]
name = "mediaharvester"
version = "0.1.0"
description = "App desktop Windows giúp editor video tìm kiếm + tải hàng loạt ảnh/video từ nhiều nguồn internet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "sqlmodel>=0.0.39",
    "pillow>=12.3.0",
    "imagehash>=4.3.2",
    "yt-dlp[default]>=2026.6.9",
]

[project.scripts]
mediaharvester-cli = "mediaharvester.cli:main"
mediaharvester = "mediaharvester.app:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediaharvester"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
